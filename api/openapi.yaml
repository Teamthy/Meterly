          description: Always "electricity purchased", never "used".
        electricity_purchased_minor:
          type: integer
        fees_minor:
          type: integer
        refunds_minor:
          type: integer
        net_charged_minor:
          type: integer
        currency:
          type: string
        vended_count:
          type: integer
        refunded_count:
          type: integer

    PropertyStatement:
      type: object
      required: [property_id, property_name, description, electricity_purchased_minor, fees_minor, refunds_minor, net_charged_minor, currency, vended_count, refunded_count, units]
      additionalProperties: false
      properties:
        property_id:
          type: string
          format: uuid
        property_name:
          type: string
        description:
          type: string
        electricity_purchased_minor:
          type: integer
        fees_minor:
          type: integer
        refunds_minor:
          type: integer
        net_charged_minor:
          type: integer
        currency:
          type: string
        vended_count:
          type: integer
        refunded_count:
          type: integer
        units:
          type: array
          items:
            $ref: "#/components/schemas/UnitStatementRow"

    MonthlyStatement:
      type: object
      required: [organisation_id, organisation_name, month, timezone, description, electricity_purchased_minor, fees_minor, refunds_minor, net_charged_minor, currency, vended_count, refunded_count, properties]
      additionalProperties: false
      properties:
        organisation_id:
          type: string
          format: uuid
        organisation_name:
          type: string
        month:
          type: string
        timezone:
          type: string
        description:
          type: string
        electricity_purchased_minor:
          type: integer
        fees_minor:
          type: integer
        refunds_minor:
          type: integer
        net_charged_minor:
          type: integer
        currency:
          type: string
        vended_count:
          type: integer
        refunded_count:
          type: integer
        properties:
          type: array
          items:
            $ref: "#/components/schemas/PropertyStatement"

    USSDCallbackRequest:
      type: object
      required: [sessionId, phoneNumber]
      properties:
        sessionId:
          type: string
        serviceCode:
          type: string
        phoneNumber:
          type: string
        text:
          type: string

    StartPhoneLinkRequest:
      type: object
      required: [phone]
      additionalProperties: false
      properties:
        phone:
          type: string
          description: E.164 phone number (e.g. `+2348031234567`).

    VerifyPhoneLinkRequest:
      type: object
      required: [phone, code]
      additionalProperties: false
      properties:
        phone:
          type: string
        code:
          type: string
          pattern: "^[0-9]{6}$"

    PhoneLinkResponse:
      type: object
      required: [status, phone_masked]
      properties:
        status:
          type: string
          enum: [otp_sent, verified]
        phone_masked:
          type: string

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    PutSupportKeyRequest:
      type: object
      required: [public_key]
      additionalProperties: false
      properties:
        public_key:
          type: string
          description: Standard-base64 P-256 SPKI public key. The private key never leaves the device.
        algorithm:
          type: string
          enum: [P-256]
          default: P-256

    SupportIdentityKey:
      type: object
      required: [user_id, public_key, algorithm, staff]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        public_key:
          type: string
        algorithm:
          type: string
          enum: [P-256]
        staff:
          type: boolean

    SupportRosterResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SupportIdentityKey"

    SupportThread:
      type: object
      required: [id, customer_id, mode, status, e2e]
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [AGENT, HUMAN]
        status:
          type: string
          enum: [OPEN, WAITING_HUMAN, ASSIGNED, RESOLVED, CLOSED]
        assigned_operator_id:
          type: string
        e2e:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time

    SupportThreadList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SupportThread"

    SupportWrappedKey:
      type: object
      required: [holder_user_id, wrapped_key, nonce]
      properties:
        holder_user_id:
          type: string
          format: uuid
        wrapped_key:
          type: string
        nonce:
          type: string

    SupportThreadDetail:
      type: object
      properties:
        thread:
          $ref: "#/components/schemas/SupportThread"
        wrapped_keys:
          type: array
          items:
            $ref: "#/components/schemas/SupportWrappedKey"
        me:
          type: string
          format: uuid
        message:
          $ref: "#/components/schemas/SupportMessage"
        customer_public_key:
          type: string
        assigned_operator_public_key:
          type: string

    SupportThreadCreated:
      type: object
      required: [thread, messages]
      properties:
        thread:
          $ref: "#/components/schemas/SupportThread"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SupportMessage"

    SupportMessage:
      type: object
      required: [id, thread_id, sender_kind, e2e, created_at]
      properties:
        id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        sender_id:
          type: string
        sender_kind:
          type: string
          enum: [CUSTOMER, OPERATOR, AGENT, SYSTEM]
        e2e:
          type: boolean
          description: When true, only ciphertext/nonce are present. The server cannot read HUMAN messages.
        ciphertext:
          type: string
        nonce:
          type: string
        body:
          type: string
          description: Present only for AGENT/SYSTEM messages (processed by Meterly, not E2E).
        created_at:
          type: string
          format: date-time

    SupportMessageList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SupportMessage"

    PostSupportMessageRequest:
      type: object
      additionalProperties: false
      properties:
        body:
          type: string
          maxLength: 2000
        ciphertext:
          type: string
        nonce:
          type: string

    PostSupportE2EMessageRequest:
      type: object
      required: [ciphertext, nonce]
      additionalProperties: false
      properties:
        ciphertext:
          type: string
        nonce:
          type: string

    PostSupportMessageResponse:
      type: object
      properties:
        message:
          $ref: "#/components/schemas/SupportMessage"
        agent_message:
          $ref: "#/components/schemas/SupportMessage"
        suggest_human:
          type: boolean

    EscalateSupportThreadRequest:
      type: object
      additionalProperties: false
      properties:
        wrapped_keys:
          type: array
          items:
            $ref: "#/components/schemas/WrapSupportKeyRequest"

    WrapSupportKeyRequest:
      type: object
      required: [holder_user_id, wrapped_key, nonce]
      additionalProperties: false
      properties:
        holder_user_id:
          type: string
          format: uuid
        wrapped_key:
          type: string
        nonce:
          type: string
