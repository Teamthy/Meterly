        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OIDC RS256 Bearer JWT outside `MODE=dev`. Staff endpoints (`/v1/admin/*`) require the
        `operator` or `admin` role claim and a verified MFA authentication method reference (`amr`).

  headers:
    XCorrelationID:
      description: Request correlation UUID echoed on responses and attached to audit events and OTel spans.
      schema:
        type: string
        format: uuid

  parameters:
    CorrelationIDHeader:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional caller-supplied correlation UUID; generated if omitted or invalid.
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated idempotency key (16–128 characters).
      schema:
        type: string
        minLength: 16
        maxLength: 128
    MeterIDPath:
      name: meter_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransactionIDPath:
      name: transaction_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderNamePath:
      name: name
      in: path
      required: true
      schema:
        type: string
    PaymentRequestIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayLinkCodePath:
      name: code
      in: path
      required: true
      schema:
        type: string
        minLength: 26
        maxLength: 26
    PayStatusCodePath:
      name: status_code
      in: path
      required: true
      schema:
        type: string
        minLength: 26
        maxLength: 26
    PotIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PotCodePath:
      name: code
      in: path
      required: true
      schema:
        type: string
        minLength: 26
        maxLength: 26
    ThreadIDPath:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AutoPowerIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceUUIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberUIDPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UnitMeterIDPath:
      name: unit_meter_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BulkPotIDPath:
      name: pot_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Malformed JSON, unknown field or invalid request parameter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthenticated:
      description: Missing/invalid Bearer token or invalid webhook signature.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated caller lacks required permission, role or MFA claim.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Requested resource or provider does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: State transition conflict, unavailable token or idempotency key conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Domain validation failure (invalid meter, expired quote, out-of-range amount or unconfirmed payment).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Rate limit exceeded; inspect `Retry-After` header.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProviderUnavailable:
      description: Upstream provider timed out or returned an ambiguous error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: Provider temporarily disabled by an operator kill switch.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorCode:
      type: string
      description: Stable machine-readable error code returned inside `ErrorEnvelope`.
      enum:
        - INVALID_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - RATE_LIMITED
        - NOT_FOUND
        - METER_NOT_FOUND
        - METER_VALIDATION_FAILED
        - METER_NOT_ELIGIBLE
        - QUOTE_EXPIRED
        - TRANSACTION_NOT_FOUND
        - PAYMENT_UNCONFIRMED
        - DELIVERY_FAILED
        - IDEMPOTENCY_CONFLICT
        - PROVIDER_NOT_FOUND
        - INVALID_SIGNATURE
        - INVALID_WEBHOOK
        - PROVIDER_UNAVAILABLE
        - FEATURE_DISABLED
        - LINK_ALREADY_PAID
        - LINK_EXPIRED
        - LINK_CANCELLED
        - LINK_UNUSABLE
        - POT_EXPIRED
        - POT_CANCELLED
        - POT_ALREADY_FUNDED
        - POT_CLOSED
        - POT_NOT_CANCELLABLE
        - POT_UNUSABLE
        - CONSENT_REQUIRED
        - PAYMENT_METHOD_NOT_REUSABLE
        - CARD_EXPIRED
        - PAYMENT_METHOD_NOT_FOUND
        - RUN_NOT_SKIPPABLE
        - LAST_OWNER
        - DUPLICATE_RESOURCE
        - UNIT_HAS_NO_METER
        - UNIT_METER_UNVERIFIED
        - INVALID_OTP
        - OTP_LOCKED
        - VERIFICATION_MISMATCH
        - EVIDENCE_REQUIRED
        - NOT_PENDING_APPROVAL
        - INTERNAL_ERROR

    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            request_id:
              type: string
              description: Correlation UUID for the request.
            details:
              type: object
              additionalProperties: true

    StatusResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string

    MoneyAmount:
      type: object
      required: [amount_minor, currency]
      additionalProperties: false
      properties:
        amount_minor:
          type: integer
          format: int64
          description: Amount in minor units (kobo for NGN).
        currency:
          type: string
          enum: [NGN]

    Capability:
      type: object
      required: [supported, authorised, reachable, confirmed, last_verified_at]
      additionalProperties: false
      properties:
        supported:
          type: boolean
        authorised:
          type: boolean
        reachable:
          type: [boolean, "null"]
        confirmed:
          type: boolean
        last_verified_at:
          type: [string, "null"]
          format: date-time

    Capabilities:
      type: object
      required: [token_vending, remote_credit, remote_reading]
      additionalProperties: false
      properties:
        token_vending:
          $ref: "#/components/schemas/Capability"
        remote_credit:
          $ref: "#/components/schemas/Capability"
        remote_reading:
          $ref: "#/components/schemas/Capability"

    ValidateMeterRequest:
      type: object
      required: [meter_number, disco_code]
      additionalProperties: false
      properties:
        meter_number:
          type: string
          minLength: 1
        disco_code:
          type: string
          minLength: 1
        label:
          type: string
        display_name:
          type: string

    RegisterMeterRequest:
      type: object
      required: [meter_number, disco_code]
      additionalProperties: false
      properties:
        meter_number:
          type: string
          minLength: 1
        disco_code:
          type: string
          minLength: 1
        label:
          type: string
        display_name:
          type: string

    AddBeneficiaryRequest:
      type: object
      required: [meter_number, disco_code, display_name]
      additionalProperties: false
      properties:
        meter_number:
          type: string
          minLength: 1
        disco_code:
          type: string
          minLength: 1
        display_name:
          type: string
          minLength: 1
        label:
          type: string

    MeterValidationResponse:
      type: object
      required:
        - valid
        - validation_status
        - masked_meter_number
        - disco
        - meter_type
        - customer_name
        - capabilities
      additionalProperties: false
      properties:
        valid:
          type: boolean
        validation_status:
          type: string
          enum: [VERIFIED]
        masked_meter_number:
          type: string
        disco:
          type: string
        meter_type:
          type: string
        customer_name:
          type: string
        capabilities:
          $ref: "#/components/schemas/Capabilities"

    Meter:
      type: object
      required:
        - meter_id
        - masked_meter_number
        - disco
        - meter_type
        - customer_name
        - address
        - validated_at
        - capabilities
      additionalProperties: false
      properties:
        meter_id:
          type: string
          format: uuid
        masked_meter_number:
          type: string
        disco:
          type: string
        meter_type:
          type: string
        customer_name:
          type: string
        address:
          type: string
        validated_at:
          type: string
          format: date-time
