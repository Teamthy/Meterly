openapi: 3.1.0
info:
  title: Meterly API
  version: 1.0.0
  summary: Prepaid electricity purchasing, gift vending, delivery orchestration and operator reconciliation API.
  description: |
    Meterly separates payment, vending and delivery into independent state dimensions so that
    money, STS tokens and remote meter commands are never lost, duplicated or conflated.

    - Monetary values are always integer minor units (`amount_minor` in kobo for `NGN`).
    - STS tokens and raw meter numbers are never logged or returned on general transaction endpoints;
      token retrieval is isolated to purchaser-only and audited operator reveal endpoints with `Cache-Control: no-store`.
    - Prometheus operational metrics are exposed only on a separate internal port (`METRICS_ADDR`, default `:9090`)
      and never on this public API surface.
servers:
  - url: http://localhost:8080
    description: Local API server

tags:
  - name: Health
    description: Liveness and readiness probes.
  - name: Meters
    description: Meter validation, registration, saved-meter access and capabilities.
  - name: Electricity
    description: Quotes, purchases, server-side payment verification, STS token retrieval, local copy tracking and receipts.
  - name: Notifications
    description: Account notification preferences and provider inbound webhooks.
  - name: PaymentRequests
    description: Shareable Pay-for-Me electricity request links, guest checkout and token-free payer status.
  - name: Pots
    description: Split-the-Meter Funding Pots, public contribution progress views and Paystack contributor checkouts.
  - name: AutoPower
    description: Saved payment methods (with explicit user consent), scheduled and capability-gated low-balance AutoPower rules, spend guards and one-tap run skip.
  - name: PowerDesk
    description: Landlord Power Desk organisations, RBAC memberships, properties, units, verified unit meters, LANDLORD_BULK Funding Pots, approval rules and ledger-derived monthly statements.
  - name: OfflineChannels
    description: Meterly Offline USSD (`*xxx#`) and WhatsApp purchase channels, webhook authentication, and SMS OTP phone linking.
  - name: Webhooks
    description: Signature-verified payment provider webhooks.
  - name: Support
    description: Meterly Agent plus end-to-end encrypted human support chat. Agent messages are processed by Meterly; human messages are ciphertext the server cannot read.
  - name: Admin
    description: Operator and administrator investigation, reconciliation, audited token reveal, refunds and provider switches (OIDC + MFA required outside dev).

paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [Health]
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Process is alive.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/XCorrelationID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /readyz:
    get:
      operationId: getReadyz
      tags: [Health]
      summary: Readiness check (database reachable and zero pending migrations)
      security: []
      responses:
        "200":
          description: Service is ready to accept traffic.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/XCorrelationID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: Database unreachable or migrations pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /v1/meters/validate:
    post:
      operationId: validateMeter
      tags: [Meters]
      summary: Validate a meter number with the vending provider without granting saved access
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateMeterRequest"
      responses:
        "200":
          description: Meter validated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterValidationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/meters:
    post:
      operationId: registerMeter
      tags: [Meters]
      summary: Validate and save a meter for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMeterRequest"
      responses:
        "201":
          description: Meter saved for the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
    get:
      operationId: listMeters
      tags: [Meters]
      summary: List meters saved by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      responses:
        "200":
          description: Saved meters for the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListedMeterListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/meters/{meter_id}:
    parameters:
      - $ref: "#/components/parameters/MeterIDPath"
      - $ref: "#/components/parameters/CorrelationIDHeader"
    get:
      operationId: getMeter
      tags: [Meters]
      summary: Get details of a saved meter
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Meter details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeSavedMeter
      tags: [Meters]
      summary: Revoke the authenticated caller's saved access to a meter
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Saved access removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/meters/{meter_id}/capabilities:
    parameters:
      - $ref: "#/components/parameters/MeterIDPath"
      - $ref: "#/components/parameters/CorrelationIDHeader"
    get:
      operationId: getMeterCapabilities
      tags: [Meters]
      summary: Get token vending, remote credit and remote reading capabilities for a saved meter
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Meter capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/beneficiaries:
    post:
      operationId: addBeneficiary
      tags: [Meters]
      summary: Save another person's meter for gift purchases (grants PURCHASE access only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddBeneficiaryRequest"
      responses:
        "201":
          description: Beneficiary meter saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeneficiaryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/electricity/quotes:
    post:
      operationId: createElectricityQuote
      tags: [Electricity]
      summary: Create a priced, single-use, time-limited electricity purchase quote
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteRequest"
      responses:
        "201":
          description: Quote created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/electricity/transactions:
    post:
      operationId: createElectricityTransaction
      tags: [Electricity]
      summary: Consume a quote and initialise payment idempotently
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/CorrelationIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "202":
          description: Transaction created and payment checkout initialised.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/ProviderUnavailable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: listElectricityTransactions
      tags: [Electricity]
      summary: List electricity transactions created by the authenticated purchaser
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      responses:
        "200":
          description: Transactions owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/electricity/transactions/{transaction_id}:
    parameters:
      - $ref: "#/components/parameters/TransactionIDPath"
      - $ref: "#/components/parameters/CorrelationIDHeader"
    get:
      operationId: getElectricityTransaction
      tags: [Electricity]
      summary: Get an electricity transaction owned by the caller
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Transaction details (never contains the raw STS token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionView"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/electricity/transactions/{transaction_id}/status:
    parameters:
      - $ref: "#/components/parameters/TransactionIDPath"
      - $ref: "#/components/parameters/CorrelationIDHeader"
    get:
      operationId: getElectricityTransactionStatus
      tags: [Electricity]
      summary: Poll transaction status across payment, vending and delivery dimensions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current transaction status view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionView"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/electricity/transactions/{transaction_id}/payment-check:
    parameters:
      - $ref: "#/components/parameters/TransactionIDPath"
      - $ref: "#/components/parameters/CorrelationIDHeader"
    post:
      operationId: checkElectricityTransactionPayment
      tags: [Electricity]
      summary: Trigger server-side payment verification and workflow continuation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated transaction state after server-side provider check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionView"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/electricity/transactions/{transaction_id}/token:
    parameters:
      - $ref: "#/components/parameters/TransactionIDPath"
      - $ref: "#/components/parameters/CorrelationIDHeader"
    get:
      operationId: getElectricityTransactionToken
      tags: [Electricity]
      summary: Retrieve the decrypted STS token for a vended TOKEN-delivery transaction (purchaser only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Decrypted STS token (`Cache-Control: no-store`)."
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/electricity/transactions/{transaction_id}/token/shares:
    parameters:
      - $ref: "#/components/parameters/TransactionIDPath"
      - $ref: "#/components/parameters/CorrelationIDHeader"
    post:
      operationId: recordTokenCopyShare
      tags: [Electricity]
      summary: Record a COPY action or send the STS token via SMS, email or WhatsApp
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordTokenShareRequest"
      responses:
        "201":
          description: Copy metadata recorded, or token send accepted (delivery is separate).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordTokenShareResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      operationId: listTokenCopyShares
      tags: [Electricity]
      summary: List purchaser COPY and token-send metadata for a transaction
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recorded token copy metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenShareListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/electricity/transactions/{transaction_id}/receipt:
    parameters:
      - $ref: "#/components/parameters/TransactionIDPath"
      - $ref: "#/components/parameters/CorrelationIDHeader"
      - name: format
        in: query
        required: false
        description: Output representation (`json` default, or `html`).
        schema:
          type: string
          enum: [json, html]
    get:
      operationId: getElectricityTransactionReceipt
      tags: [Electricity]
      summary: Get a token-free, status-honest transaction record in JSON or HTML
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Transaction receipt (JSON or CSP-hardened HTML).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [Notifications]
      summary: Get the authenticated user's transactional notification channel preferences
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      responses:
        "200":
          description: Current notification channel preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      operationId: putNotificationPreferences
      tags: [Notifications]
      summary: Update the authenticated user's transactional notification channel preferences
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Updated notification channel preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/payments/webhooks/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        description: Active payment provider slug (for example `paystack`).
        schema:
          type: string
      - $ref: "#/components/parameters/CorrelationIDHeader"
    post:
      operationId: receivePaymentWebhook
      tags: [Webhooks]
      summary: Receive an HMAC-authenticated payment webhook hint and trigger server-side verification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Webhook acknowledged (`received` or `ignored`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/notifications/inbound/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        description: Notification provider slug (`africastalking`, `resend`, or `whatsapp`).
        schema:
          type: string
      - $ref: "#/components/parameters/CorrelationIDHeader"
    get:
      operationId: verifyNotificationInboundChallenge
      tags: [Notifications]
      summary: Verify provider webhook subscription challenge (WhatsApp Cloud API GET handshake)
      security: []
      parameters:
        - name: hub.mode
          in: query
          required: false
          schema:
            type: string
        - name: hub.verify_token
          in: query
          required: false
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Challenge verified; echoes `hub.challenge`.
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: receiveNotificationInboundWebhook
      tags: [Notifications]
      summary: Receive signature-verified inbound notification events (STOP opt-outs and WhatsApp 24h windows)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        "200":
          description: Inbound webhook processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/support/keys:
    put:
      operationId: putSupportKey
      tags: [Support]
      summary: Publish this device's P-256 ECDH public key for E2E support chat
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutSupportKeyRequest"
      responses:
        "200":
          description: Stored public key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportIdentityKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/support/keys/me:
    get:
      operationId: getMySupportKey
      tags: [Support]
      summary: Fetch the caller's published support public key
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      responses:
        "200":
          description: Caller's public key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportIdentityKey"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/support/roster:
    get:
      operationId: listSupportRoster
      tags: [Support]
      summary: List staff P-256 public keys so a customer can wrap a conversation key
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      responses:
        "200":
          description: Staff identity keys (public only).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportRosterResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/support/threads:
    get:
      operationId: listSupportThreads
      tags: [Support]
      summary: List the authenticated customer's support threads
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      responses:
        "200":
          description: Customer's threads newest-first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportThreadList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createSupportThread
      tags: [Support]
      summary: Open a new Meterly Agent support thread
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
      responses:
        "201":
          description: Thread plus the agent welcome message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportThreadCreated"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/support/threads/{thread_id}:
    get:
      operationId: getSupportThread
      tags: [Support]
      summary: Get a support thread the caller owns, plus their wrapped conversation key
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationIDHeader"
        - $ref: "#/components/parameters/ThreadIDPath"
      responses:
        "200":
          description: Thread and caller-held wrapped key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportThreadDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/support/threads/{thread_id}/messages:
    get:
      operationId: listSupportMessages
