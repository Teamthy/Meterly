name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: unit + PostgreSQL integration tests
        run: go test -race -count=1 ./...
      - name: integration tests actually ran (not skipped)
        run: |
          n=$(go test -count=1 -v ./internal/orchestrator ./internal/httpapi | grep -c -- '--- PASS: .*/postgres' || true)
          echo "postgres subtests passed: $n"
          test "$n" -ge 20
      - name: migrations apply via cmd/migrate (twice, idempotent)
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate

  containers:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: build distroless non-root images (api, worker, migrate)
        run: |
          docker build --target api -t meterly-api:ci .
          docker build --target worker -t meterly-worker:ci .
          docker build --target migrate -t meterly-migrate:ci .
          for img in meterly-api:ci meterly-worker:ci meterly-migrate:ci; do
            u=$(docker image inspect "$img" --format '{{.Config.User}}')
            echo "$img user=$u"
            test "$u" = "nonroot:nonroot"
          done
      - name: compose-up mock purchase & observability smoke test
        run: ./scripts/smoke-compose.sh
