# Local PostgreSQL for development and integration tests.
#   docker compose up -d
#   export DATABASE_URL=postgres://meterly:meterly@localhost:5432/meterly?sslmode=disable
#   make migrate && make test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: meterly
      POSTGRES_PASSWORD: meterly
      POSTGRES_DB: meterly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meterly"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
